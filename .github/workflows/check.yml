name: Check
on:
  push:
  pull_request:
jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails if a token is invalid, an alias is broken, a color pair drops below WCAG AA,
      # or tokens.css / tokens.ts / tokens.json were edited by hand or not rebuilt.
      - run: npm run check
  # The production suite (issue 41): every component page, template and the showcase, used like a person would,
  # in Chromium and WebKit (Safari's engine), phone and desktop. Then the page checker (contrast as rendered, lint).
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:suite
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: suite-output
          path: tests/out
          if-no-files-found: ignore
