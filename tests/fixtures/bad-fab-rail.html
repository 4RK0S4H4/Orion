<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Known Bad: FAB In Rail</title>
<!-- Known-bad fixture (round 0059, decision 0067). tests/checker.mjs expects the page checker to FAIL this page with the
     message named in tests/checker.mjs. Never "fix" it: it exists to prove the rule fires. -->
<link rel="stylesheet" href="../../components/orion.css">
<style>
  /* labels that may break anywhere, as nav labels could until 2026-11-22 (issue 78): the squeeze splits a word */
  .s4-nav-label { overflow-wrap: anywhere; }
</style>
</head>
<body>
<!-- a FAB directly in the rail (not in .s4-nav-rail-header): it is squeezed to one glyph wide beside the items -->
<nav class="s4-nav-rail" aria-label="Main" style="position: static; inline-size: 72px">
  <button class="s4-fab" type="button" aria-label="Add Bill"><span class="s4-icon" data-icon="add"></span><span class="s4-fab-label">Add Bill Today</span></button>
  <div class="s4-nav-rail-items">
    <a class="s4-nav-item" href="#home" aria-current="page"><span class="s4-nav-indicator"><span class="s4-icon" data-icon="home"></span></span><span class="s4-nav-label">Home</span></a>
  </div>
</nav>
<!-- a label squeezed to one glyph: no word breaks mid-word, but it stacks one word per line in a box narrower than a letter and a half -->
<div style="inline-size: 12px; padding: 16px">Add Bill</div>
<script src="../../components/assets/icons.js"></script>
<script src="../../components/orion.js"></script>
</body>
</html>
