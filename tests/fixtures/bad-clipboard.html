<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Clipboard</title>
<link rel="stylesheet" href="../../components/orion.css">
</head>
<body>
<!-- Decision 0073: the share button calls clipboard.writeText itself, so a refusal is an uncaught rejection and "Link copied" is shown anyway -->
<main class="s4-content">
  <h1>Share</h1>
  <button class="s4-button" id="share" type="button">Share Link</button>
</main>
<script src="../../components/orion.js"></script>
<script>
document.getElementById('share').addEventListener('click', function () {
  navigator.clipboard.writeText(location.href);
  S4.snackbar('Link copied');
});
</script>
</body>
</html>
